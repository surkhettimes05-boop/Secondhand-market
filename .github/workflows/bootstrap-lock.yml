name: Bootstrap dependency lock
on:
  push:
    branches: ["feat/marketplace-foundation"]
    paths: [".github/workflows/bootstrap-lock.yml"]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'surkhettimes05-boop/Secondhand-market'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Generate and commit dependency lock once
        run: |
          if [ -f package-lock.json ]; then exit 0; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock marketplace dependency tree"
          git push origin HEAD:feat/marketplace-foundation
